name: MarketLens
options:
  bundleIdPrefix: com.r347h4ck3r
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
packages:
  MarketLensCore:
    path: .
targets:
  MarketLens:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MarketLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.marketlens
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Market Lens
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MarketLensTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MarketLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.marketlens.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MarketLens
schemes:
  MarketLens:
    build:
      targets:
        MarketLens: all
    test:
      targets: [MarketLensTests]
