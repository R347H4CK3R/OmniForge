name: Publish OmniForge LiveContainer Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/livecontainer-publish.yml"
permissions:
  contents: write
concurrency:
  group: omniforge-livecontainer-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build LiveContainer edition (models imported separately)
        run: |
          set -eo pipefail
          xcodebuild -project OmniForge.xcodeproj -scheme OmniForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 build 2>&1 | tee build.log
      - name: Package verified small IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/OmniForge.app Payload/
          test -x Payload/OmniForge.app/OmniForge
          zip -qry OmniForge-LiveContainer.ipa Payload
          unzip -t OmniForge-LiveContainer.ipa
          test "$(stat -f%z OmniForge-LiveContainer.ipa)" -lt 2000000000
      - name: Publish immutable tagged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="lc-${{ github.run_number }}"
          gh release create "$TAG" OmniForge-LiveContainer.ipa --title "OmniForge LiveContainer $TAG" --notes "Unsigned LiveContainer guest IPA; model imported separately. Update from the OmniForge LiveContainer source." --target "${{ github.sha }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'OmniForge-LiveContainer.ipa'
      - name: Update public LiveContainer source only after release succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update_livecontainer_source.py "lc-${{ github.run_number }}" "${{ github.run_number }}" OmniForge-LiveContainer.ipa livecontainer-source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livecontainer-source.json
          git commit -m "catalog: publish LiveContainer build ${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-LiveContainer-build-log
          path: build.log
          retention-days: 7
