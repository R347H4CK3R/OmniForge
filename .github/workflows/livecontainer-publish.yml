name: Publish OmniForge LiveContainer Update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/livecontainer-publish.yml"
permissions:
  contents: write
concurrency:
  group: omniforge-livecontainer-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate OmniForge app icon
        run: |
          swift scripts/generate_icon.swift App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cp App/Assets.xcassets/AppIcon.appiconset/AppIcon.png OmniForgeIcon.png
          test -s OmniForgeIcon.png
      - name: Generate project
        run: xcodegen generate
      - name: Build LiveContainer edition (models imported separately)
        run: |
          set -eo pipefail
          xcodebuild -project OmniForge.xcodeproj -scheme OmniForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.${{ github.run_number }} build 2>&1 | tee build.log
      - name: Package verified small IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/OmniForge.app Payload/
          test -x Payload/OmniForge.app/OmniForge
          zip -qry OmniForge-LiveContainer.ipa Payload
          unzip -t OmniForge-LiveContainer.ipa
          test "$(stat -f%z OmniForge-LiveContainer.ipa)" -lt 2000000000
      - name: Publish immutable tagged release asset
        env:
          GH_TOKEN: ${{ secrets.OMNIFORGE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="lc-${{ github.run_number }}"
          gh release create "$TAG" OmniForge-LiveContainer.ipa OmniForgeIcon.png --title "OmniForge LiveContainer $TAG" --notes "Unsigned LiveContainer guest IPA; model imported separately. Update from the OmniForge LiveContainer source." --target "${{ github.sha }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'OmniForge-LiveContainer.ipa'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'OmniForgeIcon.png'
      - name: Update public LiveContainer source only after release succeeds
        env:
          GH_TOKEN: ${{ secrets.OMNIFORGE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B catalog-update origin/main
            python3 scripts/update_livecontainer_source.py "lc-${{ github.run_number }}" "${{ github.run_number }}" OmniForge-LiveContainer.ipa livecontainer-source.json
            git add livecontainer-source.json
            if git diff --cached --quiet; then
              echo "Catalog already up to date"
              exit 0
            fi
            git commit -m "catalog: publish LiveContainer build ${{ github.run_number }}"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" push origin HEAD:main; then
              echo "Catalog published"
              exit 0
            fi
            echo "Concurrent change detected; refreshing catalog (attempt $attempt)"
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-LiveContainer-build-log
          path: build.log
          retention-days: 7
