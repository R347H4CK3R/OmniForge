name: Verify signed Android release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing android release tag
        required: true
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download exact signed artifact and check catalog hash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^android-[0-9]+$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern OmniForge-Android.apk --pattern android-source.json --clobber
          python - <<'PY'
          import hashlib,json
          expected=json.load(open('android-source.json'))['sha256']
          with open('OmniForge-Android.apk','rb') as f:actual=hashlib.file_digest(f,'sha256').hexdigest()
          assert actual==expected
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python scripts/android_release_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-Android-release-screenshots
          path: release-verification/
