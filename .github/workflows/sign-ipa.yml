name: Sign authorized IPA (macOS)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing your unsigned IPA"
        required: true
        type: string
      ipa_asset:
        description: "IPA filename (for example OmniForge-unsigned.ipa)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      IPA_ASSET: ${{ inputs.ipa_asset }}
      P12_B64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      SIGN_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$P12_B64" && -n "$P12_PASSWORD" && -n "$PROFILE_B64" && -n "$SIGN_IDENTITY" ]] || { echo "Signing secrets or identity missing"; exit 1; }
          [[ "$IPA_ASSET" == *.ipa && "$IPA_ASSET" != */* && "$IPA_ASSET" != *..* ]] || exit 1
      - name: Download IPA
        run: |
          mkdir -p work results
          gh release download "$RELEASE_TAG" --pattern "$IPA_ASSET" --dir work
          python3 scripts/ipa_workbench.py unpack "work/$IPA_ASSET" work/unsigned
      - name: Import Apple certificate and provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          echo "$P12_B64" | base64 -D > "$RUNNER_TEMP/sign.p12"
          echo "$PROFILE_B64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/omniforge-sign.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist"
          find work/unsigned/Payload -maxdepth 1 -name '*.app' -type d -print -quit > "$RUNNER_TEMP/app_path"
          test -s "$RUNNER_TEMP/app_path"
          APP=$(cat "$RUNNER_TEMP/app_path")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
      - name: Sign nested code and main application
        shell: bash
        run: |
          set -euo pipefail
          APP=$(cat "$RUNNER_TEMP/app_path")
          while IFS= read -r item; do
            codesign --force --sign "$SIGN_IDENTITY" --timestamp=none "$item"
          done < <(find "$APP" -depth \( -name '*.framework' -o -name '*.appex' -o -name '*.dylib' \) -print)
          codesign --force --sign "$SIGN_IDENTITY" --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd work/unsigned && zip -qry "$GITHUB_WORKSPACE/results/OmniForge-signed.ipa" Payload)
          unzip -t results/OmniForge-signed.ipa
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          security delete-keychain "$RUNNER_TEMP/omniforge-sign.keychain-db" || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniForge-signed-IPA
          path: results/OmniForge-signed.ipa
          retention-days: 7
