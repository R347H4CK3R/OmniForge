name: Ghidra IPA Reverse Engineering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghidra-analysis.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing an IPA you may analyze"
        required: true
        type: string
      ipa_asset:
        description: "IPA asset filename"
        required: true
        type: string
      screenshots_asset:
        description: "Optional ZIP of authorized UI screenshots from the same release"
        required: false
        type: string
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch authorized IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'lc-6' }}
          IPA: ${{ inputs.ipa_asset || 'OmniForge-LiveContainer.ipa' }}
          SCREENSHOTS: ${{ inputs.screenshots_asset }}
        run: |
          set -euo pipefail
          [[ "$IPA" == *.ipa && "$IPA" != */* && "$IPA" != *..* ]] || exit 1
          mkdir -p input output
          gh release download "$TAG" --pattern "$IPA" --dir input
          python3 scripts/prepare_ghidra_ipa.py "input/$IPA" output
          if [[ -n "$SCREENSHOTS" ]]; then
            [[ "$SCREENSHOTS" == *.zip && "$SCREENSHOTS" != */* && "$SCREENSHOTS" != *..* ]] || exit 1
            gh release download "$TAG" --pattern "$SCREENSHOTS" --dir input
            python3 scripts/prepare_ui_screenshots.py "input/$SCREENSHOTS" output
          fi
      - name: Download official Ghidra release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,os
          req=urllib.request.Request('https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest',headers={'User-Agent':'OmniForge-Ghidra'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          matches=[x for x in data['assets'] if x['name'].endswith('.zip') and x['name'].startswith('ghidra_')]
          if len(matches)!=1:raise SystemExit('Unexpected Ghidra release assets')
          urllib.request.urlretrieve(matches[0]['browser_download_url'],'ghidra.zip')
          PY
          unzip -q ghidra.zip -d ghidra-dist
          GHIDRA_DIR=$(find ghidra-dist -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
      - name: Headless pseudocode (bounded)
        run: |
          set -euo pipefail
          mkdir -p /tmp/omniforge-ghidra-project
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          root=pathlib.Path('output')
          for item in json.loads((root/'architectures.json').read_text())['slices']:
              label=item['name']
              binary=root/item['file']
              target=root/('pseudocode_'+label+'.c')
              log=root/('ghidra_'+label+'.log')
              cmd=[str(pathlib.Path(os.environ['GHIDRA_DIR'])/'support/analyzeHeadless'),'/tmp/omniforge-ghidra-project','OmniForge_'+label,'-import',str(binary.resolve()),'-scriptPath',str(pathlib.Path('ghidra_scripts').resolve()),'-postScript','OmniForgeDecompile.java',str(target.resolve()),'-deleteProject']
              with log.open('w') as f:
                  proc=subprocess.run(cmd,stdout=f,stderr=subprocess.STDOUT,timeout=1400)
              if proc.returncode or not target.is_file() or not target.stat().st_size:
                  raise SystemExit('Ghidra failed for '+label+'; see '+str(log))
          PY
          rm -f output/main_macho output/main_*.macho
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-ghidra-analysis
          path: output/
          retention-days: 7

  scaffold-build:
    needs: decompile
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download decompilation evidence
        uses: actions/download-artifact@v4
        with:
          name: OmniForge-ghidra-analysis
          path: evidence
      - name: Obtain authorized IPA for scaffold metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'lc-6' }}
          IPA: ${{ inputs.ipa_asset || 'OmniForge-LiveContainer.ipa' }}
        run: |
          set -euo pipefail
          [[ "$IPA" == *.ipa && "$IPA" != */* && "$IPA" != *..* ]] || exit 1
          mkdir -p input
          gh release download "$TAG" --pattern "$IPA" --dir input
          python3 scripts/generate_scaffold.py "input/$IPA" reconstructed
          python3 scripts/enhance_reconstruction.py reconstructed evidence
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and compile reconstruction scaffold
        run: |
          set -o pipefail
          cd reconstructed
          xcodegen generate
          xcodebuild -project Reconstruction.xcodeproj -scheme Reconstruction -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../reconstruction-build.log
      - name: Build unsigned physical-device scaffold
        run: |
          set -o pipefail
          cd reconstructed
          xcodebuild -project Reconstruction.xcodeproj -scheme Reconstruction -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../DeviceDerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../reconstruction-device-build.log
          cd ..
          test -d DeviceDerivedData/Build/Products/Release-iphoneos/Reconstruction.app
          mkdir -p Payload
          cp -R DeviceDerivedData/Build/Products/Release-iphoneos/Reconstruction.app Payload/
          zip -qry Reconstruction-unsigned.ipa Payload
          unzip -t Reconstruction-unsigned.ipa
      - name: Record exact evidence and limitations
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          app=pathlib.Path("DerivedData/Build/Products/Debug-iphonesimulator/Reconstruction.app")
          report={"schema":1,"buildable_scaffold":app.is_dir(),
                  "recovered_original_source":False,
                  "functional_equivalence_verified":False,
                  "physical_iphone_launch_verified":False,
                  "unsigned_device_ipa_built":pathlib.Path("Reconstruction-unsigned.ipa").is_file(),
                  "artifact_type":"clean-room scaffold outputs; unsigned IPA requires signing",
                  "source":"Authorized IPA metadata and optional evidence"}
          pathlib.Path("reconstruction-verification.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Package compiled scaffold and evidence
        if: always()
        run: |
          if [ -d DerivedData/Build/Products/Debug-iphonesimulator/Reconstruction.app ]; then
            ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/Reconstruction.app Reconstruction-simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-reconstruction-scaffold-and-build-evidence
          path: |
            reconstructed/
            reconstruction-build.log
            reconstruction-verification.json
            Reconstruction-simulator.zip
            Reconstruction-unsigned.ipa
            reconstruction-device-build.log
          retention-days: 7
