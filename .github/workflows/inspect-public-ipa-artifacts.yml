name: Inspect remaining public IPA artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-public-ipa-artifacts.yml'
      - 'scripts/inspect_ci_ipas.py'
      - 'scripts/test_inspect_ci_ipas.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: inspect-public-ipa-artifacts
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - repository: R347H4CK3R/PocketForge
            run: 40411268941
            artifact: '12693233058'
          - repository: R347H4CK3R/madeira-cod-test
            run: 40346816186
            artifact: '12662370968'
          - repository: R347H4CK3R/BO2-IOS-CS
            run: 36003097069
            artifact: '10809800035'
          - repository: R347H4CK3R/BO2CS
            run: 35542001636
            artifact: '10614504342'
          - repository: R347H4CK3R/CSNZ-iOS
            run: 36201512410
            artifact: '10891229849'
          - repository: R347H4CK3R/Hijacked-Quake3-iOS-
            run: 35221891882
            artifact: '10501333638'
          - repository: R347H4CK3R/-Native-Zombies-iOS
            run: 36511217716
            artifact: '11008099931'
          - repository: R347H4CK3R/COD4iOS-COD4NS
            run: 38847728229
            artifact: '12024705977'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only inspector
        run: python3 -m unittest discover -s scripts -p 'test_inspect_ci_ipas.py' -v
      - name: Require public repository and successful source run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ matrix.repository }}
          SOURCE_RUN: ${{ matrix.run }}
        run: |
          gh api "repos/$TARGET_REPO" --jq '.private == false and .visibility == "public"' | grep -x true
          gh api "repos/$TARGET_REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion == "success"' | grep -x true
      - name: Download exact public build artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ matrix.repository }}
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Inspect IPA metadata, device platform and dependency requirements
        run: python3 scripts/inspect_ci_ipas.py candidate --output ipa-inspection.json
      - name: Publish inspection receipt only, never app binaries
        uses: actions/upload-artifact@v4
        with:
          name: public-ipa-inspection-${{ matrix.artifact }}
          path: ipa-inspection.json
          if-no-files-found: error
          retention-days: 30
