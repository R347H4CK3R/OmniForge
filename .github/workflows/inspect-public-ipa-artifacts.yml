name: Inspect remaining public IPA artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-public-ipa-artifacts.yml'
      - 'scripts/inspect_ci_ipas.py'
      - 'scripts/test_inspect_ci_ipas.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: inspect-public-ipa-artifacts
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - repository: R347H4CK3R/BO2-IOS-CS
            run: 42519149258
            artifact: '13632817094'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only inspector
        run: python3 -m unittest discover -s scripts -p 'test_inspect_ci_ipas.py' -v
      - name: Require public repository and exact candidate source revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ matrix.repository }}
          SOURCE_RUN: ${{ matrix.run }}
        run: |
          gh api "repos/$TARGET_REPO" --jq '.private == false and .visibility == "public"' | grep -x true
          gh api "repos/$TARGET_REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha == "b2af0a851d64d8505b9ac9075661f793499d7592"' | grep -x true
      - name: Download exact public build artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ matrix.repository }}
          run-id: ${{ matrix.run }}
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Inspect IPA metadata, device platform and dependency requirements
        run: python3 scripts/inspect_ci_ipas.py candidate --output ipa-inspection.json
      - name: Download BO2CS simulator receipt for readiness review
        if: matrix.repository == 'R347H4CK3R/BO2CS'
        uses: actions/download-artifact@v4
        with:
          repository: R347H4CK3R/BO2CS
          run-id: 35542001636
          artifact-ids: '10615242465'
          github-token: ${{ github.token }}
          path: runtime-receipt
      - name: Report only BO2CS test outcome, not private paths or logs
        if: matrix.repository == 'R347H4CK3R/BO2CS'
        run: |
          python3 - <<'PYCODE'
          import json,pathlib
          paths=list(pathlib.Path('runtime-receipt').rglob('AUTOTEST_RESULT.json'))+list(pathlib.Path('runtime-receipt').rglob('runtime.json'))
          assert 0<len(paths)<=10
          outcomes=[]
          for path in paths:
              data=json.loads(path.read_text())
              outcome={k:data[k] for k in ('status','passed','device_ipa_executed') if k in data}
              if outcome not in outcomes: outcomes.append(outcome)
          print(json.dumps({'simulatorOutcomes':outcomes},indent=2))
          PYCODE
      - name: Publish inspection receipt only, never app binaries
        uses: actions/upload-artifact@v4
        with:
          name: public-ipa-inspection-${{ matrix.artifact }}
          path: ipa-inspection.json
          if-no-files-found: error
          retention-days: 30
