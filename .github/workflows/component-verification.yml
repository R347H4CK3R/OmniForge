name: OmniForge Component Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/component-verification.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/component-verification.yml'
permissions:
  contents: read
jobs:
  python-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static project requirements
        run: python scripts/release_gate.py
      - name: Verify Python modules
        run: python -m compileall -q server scripts
      - name: Run all regression tests
        run: python -m unittest discover -s server -p "test_*.py" -v
      - name: Produce honest component matrix
        if: always()
        run: python scripts/verify_components.py --output verification-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-verification-${{ matrix.os }}
          path: verification-report.json
          retention-days: 30
