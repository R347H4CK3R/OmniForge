name: Market Lens native verification
on:
  push:
    branches: [feature/market-lens-native]
    paths: ['apps/MarketLens/**', '.github/workflows/market-lens-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-lens-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/MarketLens
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode" || { echo 'Xcode 26 required and unavailable'; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Test core and package verifier
        run: |
          swift test 2>&1 | tee swift-tests.log
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project MarketLens.xcodeproj -scheme MarketLens -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-build.log
      - name: Native simulator smoke tests
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for r,v in d["devices"].items() if "iOS-26" in r for x in v if "iPhone" in x["name"]))')
          xcodebuild -project MarketLens.xcodeproj -scheme MarketLens -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee native-tests.log
          xcrun simctl io "$device" screenshot build/screenshot.png
      - name: Package and validate unsigned IPA
        run: |
          mkdir -p build/package/Payload build/artifacts
          cp -R build/device/Build/Products/Release-iphoneos/MarketLens.app build/package/Payload/
          lipo -archs build/package/Payload/MarketLens.app/MarketLens | grep -x arm64
          (cd build/package && zip -qr ../artifacts/MarketLens-0.1.0-build1.ipa Payload)
          python3 scripts/verify_ipa.py build/artifacts/MarketLens-0.1.0-build1.ipa > build/artifacts/verified-ipa.json
          (cd build/artifacts && shasum -a 256 MarketLens-0.1.0-build1.ipa > SHA256SUMS)
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-lens-verification
          path: |
            apps/MarketLens/build/artifacts/
            apps/MarketLens/build/UITests.xcresult/
            apps/MarketLens/build/screenshot.png
            apps/MarketLens/*-tests.log
            apps/MarketLens/native-build.log
          retention-days: 14
