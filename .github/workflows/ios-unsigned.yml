name: Build OmniForge iPhone IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'App/**'
      - 'project.yml'
      - '.github/workflows/ios-unsigned.yml'
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'project.yml'
      - '.github/workflows/ios-unsigned.yml'
      - 'Resources/**'
      - 'Assets/**'
concurrency:
  group: omniforge-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Static release checks
        run: python3 scripts/release_gate.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch redistributable bundled GGUF (build-time only)
        run: |
          set -euo pipefail
          curl -fL --retry 4 --connect-timeout 30 --max-time 1800 \
            "https://huggingface.co/Open4bits/Qwen3-4B-Instruct-2507-GGUF/resolve/main/qwen3-4b-instruct-2507-Q4_K_M.gguf" \
            -o BundledModel.gguf
          test "$(stat -f%z BundledModel.gguf)" -gt 2400000000
          shasum -a 256 BundledModel.gguf
          python3 - <<'PY'
          with open("BundledModel.gguf", "rb") as f:
              assert f.read(4) == b"GGUF", "Downloaded model is not GGUF"
          PY
      - name: Generate app icon
        run: swift scripts/generate_icon.swift App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild -project OmniForge.xcodeproj -scheme OmniForge -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 build 2>&1 | tee build.log
      - name: Package LiveContainer IPA from same compiled app
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/OmniForge.app Payload/
          test -x Payload/OmniForge.app/OmniForge
          swift scripts/generate_icon.swift App/Assets.xcassets/AppIcon.appiconset/OmniForgeIcon.png
          cp App/Assets.xcassets/AppIcon.appiconset/OmniForgeIcon.png OmniForgeIcon.png
          zip -qry OmniForge-LiveContainer.ipa Payload
          unzip -t OmniForge-LiveContainer.ipa
          test "$(stat -f%z OmniForge-LiveContainer.ipa)" -lt 2000000000
          rm -rf Payload
      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/OmniForge.app Payload/
          cp BundledModel.gguf Payload/OmniForge.app/BundledModel.gguf
          test -s Payload/OmniForge.app/BundledModel.gguf
          zip -qry OmniForge-unsigned.ipa Payload
          unzip -t OmniForge-unsigned.ipa
      - name: Publish LiveContainer release from successful IPA build
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.OMNIFORGE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="lc-${{ github.run_number }}"
          gh release create "$TAG" OmniForge-LiveContainer.ipa OmniForgeIcon.png --title "OmniForge LiveContainer $TAG" --notes "Unsigned LiveContainer guest IPA built in the same CI run as the bundled-model IPA." --target "${{ github.sha }}"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'OmniForge-LiveContainer.ipa'
      - name: Update LiveContainer source after successful publishing
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.OMNIFORGE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B catalog-update origin/main
            python3 scripts/update_livecontainer_source.py "lc-${{ github.run_number }}" "${{ github.run_number }}" OmniForge-LiveContainer.ipa livecontainer-source.json
            git add livecontainer-source.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "catalog: publish LiveContainer build ${{ github.run_number }}"
            if git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniForge-build-and-logs
          path: |
            OmniForge-unsigned.ipa
            OmniForge-LiveContainer.ipa
            build.log
          if-no-files-found: warn
          retention-days: 30
