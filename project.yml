name: OmniForge
options:
  bundleIdPrefix: com.r347h4ck3r
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp
    branch: main
targets:
  OmniForge:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SwiftLlama
        product: SwiftLlama
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.omniforge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniForge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  OmniForge:
    build:
      targets:
        OmniForge: all
